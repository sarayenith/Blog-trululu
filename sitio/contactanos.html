<section class="hero-contacto">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-md-6 texto-contacto">
                <h1>Contáctanos</h1>
                <div class="linea-contacto"></div>

                <p>
                    Estamos aquí para ayudarte y escucharte.
                    Puedes dejar aquí tus dudas, preguntas o
                    recomendaciones para mejorar nuestros productos.
                </p>
            </div>

            <div class="col-md-6 imagen-contacto">
                <img src="img/sobre.png"
                     alt="Ilustración de un sobre con una carta"
                     class="img-fluid">
            </div>

        </div>
    </div>
</section>


<section class="formulario-contacto">
    <div class="container">

        <h2>Aquí puedes escribir</h2>

        <form action="#" method="post">

            <div class="mb-4">
                <label for="nombre" class="form-label">
                    Nombre completo
                </label>

                <input type="text"
                       class="form-control"
                       id="nombre"
                       name="nombre"
                       placeholder="Escribe tu nombre"
                       required>
            </div>

            <div class="mb-4">
                <label for="correo" class="form-label">
                    Correo electrónico
                </label>

                <input type="email"
                       class="form-control"
                       id="correo"
                       name="correo"
                       placeholder="Escribe tu correo"
                       required>
            </div>

            <div class="mb-4">
                <label for="asunto" class="form-label">
                    Asunto
                </label>

                <input type="text"
                       class="form-control"
                       id="asunto"
                       name="asunto"
                       placeholder="Escribe el asunto"
                       required>
            </div>

            <div class="mb-4">
                <label for="mensaje" class="form-label">
                    Mensaje
                </label>

                <textarea class="form-control"
                          id="mensaje"
                          name="mensaje"
                          placeholder="Escribe tu mensaje"
                          rows="6"
                          required></textarea>
            </div>

            <div class="text-center boton-enviar">
                <button type="submit" class="btn btn-enviar">
                    Enviar mensaje
                </button>
            </div>

        </form>

    </div>
</section>
